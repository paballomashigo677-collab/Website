<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games for Learning Team</title>
<style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }
       body {
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
           background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
           min-height: 100vh;
           padding: 40px 20px;
       }
       .container {
           max-width: 1200px;
           margin: 0 auto;
       }
       h1 {
           text-align: center;
           color: white;
           font-size: 2.5em;
           margin-bottom: 50px;
           text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
       }
       .team-grid {
           display: flex;
           flex-wrap: wrap;
           grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
           justify-content: center;
           gap: 30px;
           padding: 20px;
       }
       .team-member {
           width: 700px;
           background: white;
           border-radius: 50px;
           padding: 3%;
           margin: 20px auto;
           box-shadow:  10px  rgba(0,0,0,0.2);
           text-align: center;
           transition: transform 0.3s ease, box-shadow 0.3s ease;
       }
       .team-member:hover {
           transform: translateY(-10px);
           box-shadow: 0 15px 40px rgba(0,0,0,0.3);
       }
       .photo-placeholder {
           width: 180px;
           height: 180px;
           margin: 0 auto 20px;
           border-radius: 50%;
           background: linear-gradient(135deg, #e0e7ff 0%, #f3e7ff 100%);
           border: 4px solid #667eea;
           display: flex;
           align-items: center;
           justify-content: center;
           font-size: 3em;
           color: #667eea;
           overflow: hidden;
       }
       .photo-placeholder img {
           width: 100%;
           height: 100%;
           object-fit: cover;
       }
       .member-name {
           font-size: 1.4em;
           color: #333;
           font-weight: 600;
           margin-top: 15px;
       }
       .upload-note {
           margin-top: 15px;
           font-size: 0.85em;
           color: #666;
           font-style: italic;
       }
       @media (max-width: 768px) {
           h1 {
               font-size: 1.8em;
           }
           .team-grid {
               grid-template-columns: 1fr;
           }
       }
</style>
</head>
<body>
<div class="container">
<h1>Games for Learning Company Members</h1>
<div class="team-grid">

</div>
<div class="team-member">
<img src="./Nelisa.jpeg" alt="Nelisa Madyibi" class="photo-placeholder">
<div class="member-name">Nelisa Madyibi</div>
<div class="upload-note">Insert photo here</div>
</div>

<br>
</div>
<div class="team-member">
<img src="./paballo.jpeg" alt="Paballo Mashigo" class="photo-placeholder">
<div class="member-name">Paballo Mashigo</div>
<div class="upload-note">Insert photo here</div>
</div>

<br>
</div>
<div class="team-member">
<img src="./Tshepang.jpeg" alt="Tshepang Shabalala" class="photo-placeholder">
<div class="member-name">Tshepang Shabalala</div>
<div class="upload-note">Insert photo here</div>
</div>

<br>
</div>
<div class="team-member">
<img src="./ele.jpeg" alt="Elekanyani Sadiki" class="photo-placeholder">
<div class="member-name">Elekanyani Sadiki</div>
<div class="upload-note">Insert photo here</div>
</div>


</div>
</div>
</body>
</html>
